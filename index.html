<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>은빛 변신과 전자의 비밀 : 산화·환원 게임 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ===== 글꼴 : a시네마L (기기에 설치된 글꼴 사용, 없으면 Gaegu로 대체) =====
   ※ TTF 파일을 base64로 내장하려면 아래 @font-face 의 src 뒤에 url(data:font/ttf;base64,...) 를 추가하세요. */
@font-face{font-family:'a시네마L';src:local('a시네마L'),local('a시네마'),local('aCinemaL');font-weight:400;font-style:normal;}
:root{
  --ink:#2f3b57; --mute:#6c7a99; --line:#cfe0ff; --bg1:#e7f5ff; --bg2:#fff4e0;
  --red:#d6336c; --blue:#1c7ed6; --green:#2b9a44; --orange:#e8590c; --violet:#7048e8; --teal:#0c8599;
}
*{box-sizing:border-box;font-family:'a시네마L','a시네마','Gaegu','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-weight:400 !important;font-synthesis:none;}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-size:19px;line-height:1.65;background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;-webkit-text-size-adjust:100%}
b,strong,h1,h2,h3,h4,th{font-weight:400}
.k-r{color:var(--red)} .k-b{color:var(--blue)} .k-g{color:var(--green)} .k-o{color:var(--orange)} .k-v{color:var(--violet)} .k-t{color:var(--teal)}
.mute{color:var(--mute)}

/* ----- 헤더 (오른쪽 위: 로고 + 이메일) ----- */
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;max-width:1040px;margin:0 auto;padding:14px 18px 6px}
.title h1{margin:0;font-size:34px;color:var(--violet);line-height:1.2}
.title p{margin:4px 0 0;color:var(--mute);font-size:17px}
.brand{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:150px}
.brand img{width:76px;height:76px;object-fit:contain;display:block}
.brand .mail{font-size:15px;color:var(--blue);margin-top:-4px;white-space:nowrap}

/* ----- 탭 ----- */
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;max-width:1040px;margin:6px auto 0;padding:0 18px;align-items:center}
.tab{font-size:17px;padding:8px 14px;border-radius:14px 14px 4px 4px;border:3px solid var(--line);background:#fff;color:var(--mute);cursor:pointer}
.tab.on{background:var(--violet);border-color:var(--violet);color:#fff}
.tab.clear{border-color:#8ce99a;color:var(--green)}
.tab.on.clear{color:#fff}
.tab.lock{background:#f1f3f5;border-color:#dee2e6;color:#adb5bd;cursor:not-allowed}
.tab.result-tab:not(.lock){border-color:#ffc078;color:var(--orange)}
.tab.result-tab.on{background:var(--orange);color:#fff;border-color:var(--orange)}


.idform{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.idrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.idrow input{font-size:20px;padding:6px 10px;border:3px solid #bac8ff;border-radius:14px;color:var(--ink);width:96px;text-align:center}
.idrow input.wide{width:200px;text-align:left;padding:6px 12px}
.idrow input:focus{outline:none;border-color:var(--violet)}
main{max-width:1040px;margin:10px auto 60px;padding:0 18px}
.panel{display:none}
.panel.on{display:block;animation:fadein .35s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:#fff;border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 #dbe8fb;padding:16px 18px;margin-bottom:16px}
.stagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.stagehead h2{margin:0;font-size:28px;color:var(--blue)}
.chip{display:inline-block;font-size:15px;padding:1px 12px;border-radius:12px;background:#fff0f6;color:var(--red);border:2px solid #ffc9de}
.mission{display:flex;gap:12px;align-items:center;background:#fff9db;border:3px dashed #ffc078;border-radius:18px;padding:10px 16px;margin-bottom:14px}
.mission .mi{font-size:38px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.st{font-size:15px;padding:2px 12px;border-radius:12px;background:#f1f3f5;color:#adb5bd}
.st.c{background:#fff3bf;color:var(--orange);outline:2px solid #ffd43b}
.st.d{background:#d3f9d8;color:var(--green)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.two{grid-template-columns:1fr} .title h1{font-size:25px} body{font-size:18px} .brand{min-width:110px}.brand img{width:56px;height:56px}.brand .mail{font-size:12px}}

/* ----- 버튼 ----- */
.btn{font-size:19px;color:#fff;background:linear-gradient(#5aa9ff,#2f80ed);border:0;border-radius:16px;padding:10px 22px;box-shadow:0 5px 0 #1c5fb8,0 8px 14px rgba(0,0,0,.12);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c5fb8}
.btn.green{background:linear-gradient(#69db7c,#2f9e44);box-shadow:0 5px 0 #237a34,0 8px 14px rgba(0,0,0,.12)}
.btn.orange{background:linear-gradient(#ffa94d,#f76707);box-shadow:0 5px 0 #c24d05,0 8px 14px rgba(0,0,0,.12)}
.btn.violet{background:linear-gradient(#9775fa,#6741d9);box-shadow:0 5px 0 #4c2fb0,0 8px 14px rgba(0,0,0,.12)}
.btn.pink{background:linear-gradient(#ff8fb8,#e64980);box-shadow:0 5px 0 #b0335f,0 8px 14px rgba(0,0,0,.12)}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);box-shadow:0 3px 0 #a5d8ff}
.btn.small{font-size:16px;padding:6px 14px}
.btn[disabled]{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.glow{animation:glow 1.2s infinite alternate}
@keyframes glow{from{box-shadow:0 5px 0 #237a34,0 0 0 rgba(43,154,68,0)}to{box-shadow:0 5px 0 #237a34,0 0 22px rgba(43,154,68,.8)}}

/* ----- 메시지 ----- */
.msg{min-height:2.8em;margin-top:10px;padding:8px 14px;border-radius:14px;background:#f1f3f5;color:var(--ink)}
.msg.ok{background:#ebfbee;color:#237a34}
.msg.bad{background:#fff0f6;color:var(--red)}
.msg.info{background:#e7f5ff;color:var(--blue)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:#fff;border:3px solid var(--violet);color:var(--violet);border-radius:18px;padding:10px 22px;opacity:0;pointer-events:none;transition:.35s;z-index:9998;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ----- 드래그 ----- */
.dragghost{position:fixed;transform:translate(-50%,-50%) scale(1.08);pointer-events:none;z-index:9999;opacity:.96;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.eghost{width:34px;height:34px;border-radius:50%;background:#ffd43b;border:3px solid #f08c00;color:#7a4300;display:flex;align-items:center;justify-content:center;font-size:14px}
.dragging{opacity:.3}
.wardrobe{display:flex;flex-wrap:wrap;gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 8px;background:#fff;border:3px solid #ffd8a8;border-radius:18px;cursor:grab;user-select:none;min-width:98px;touch-action:none}
.tile .emo{font-size:44px;line-height:1.1}
.tile.off{opacity:.35;pointer-events:none;filter:grayscale(1)}
.avatarbox{text-align:center}
.avatarbox svg{width:100%;max-width:280px;height:auto;display:block;margin:0 auto}
.layer{opacity:0;transition:opacity .45s}
.layer.on{opacity:1}
.wornlist{margin-top:6px;color:var(--mute);font-size:17px;min-height:3.4em}

/* ----- 도구 확인 ----- */
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:760px){.tools{grid-template-columns:repeat(2,1fr)}}
.tool{border:3px solid #d0ebff;border-radius:18px;padding:8px;text-align:center;cursor:pointer;background:#fff;position:relative}
.tool svg,.tool .emo{width:64px;height:64px;font-size:52px;line-height:64px;display:block;margin:0 auto}
.tool.ck{border-color:#8ce99a;background:#ebfbee}
.tool.ck::after{content:'✔';position:absolute;top:2px;right:8px;color:var(--green)}

/* ----- 장면 ----- */
.scene{position:relative;width:100%;background:#fff;border:3px solid var(--line);border-radius:22px;overflow:hidden}
.scene>svg{display:block;width:100%;height:auto}
.ov{position:absolute}
.scene.zoom>svg,.scene.zoom>.ov{transition:transform 1.1s ease,opacity 1.1s ease;transform:scale(2.8);opacity:0}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 65% 45%,#fff 0,#fffbe0 40%,rgba(255,255,255,0) 75%);opacity:0;pointer-events:none}
.flash.on{animation:flash 1.3s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:.9}100%{opacity:0}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.93,1.07)}}
.pieceov{cursor:grab;touch-action:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.tongs{cursor:grab;touch-action:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.cbtn{font-size:17px;padding:5px 14px;border-radius:14px;border:3px solid #ffd8a8;background:#fff;color:var(--orange);cursor:pointer}
.cbtn.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.cbtn[disabled]{opacity:.45;cursor:not-allowed}

/* ----- 미시 세계 ----- */
.micro svg{width:100%;height:auto;display:block;background:#fff;border-radius:16px;border:3px solid #d0ebff}
.el{cursor:pointer;touch-action:none}
.el.selected{filter:drop-shadow(0 0 7px #e64980) drop-shadow(0 0 7px #e64980)}
.ag{cursor:pointer}
.slotg,[data-drop='O']{cursor:pointer}
[data-drop='no3']{cursor:pointer}
.el.used{display:none}
.wob{animation:wob 1.6s ease-in-out infinite alternate}
@keyframes wob{from{transform:translate(0,0)}to{transform:translate(3px,-3px)}}
.fl1{animation:fl 3s ease-in-out infinite alternate}
.fl2{animation:fl 3.7s ease-in-out infinite alternate-reverse}
@keyframes fl{from{transform:translate(0,0)}to{transform:translate(5px,-7px)}}
.mv{transition:transform 1.3s ease}
.fade{transition:opacity .8s}
.infoRow{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:17px}
.infoRow span{background:#f8f9fa;border-radius:12px;padding:2px 12px}
.eqbox{margin-top:12px;background:#f3f0ff;border:3px solid #d0bfff;border-radius:16px;padding:10px 14px;text-align:center;font-size:22px;animation:fadein .6s}

/* ----- 판단 / 선택 ----- */
.sent{font-size:21px;margin:12px 0;line-height:2.3}
.opt2{display:inline-flex;gap:4px;vertical-align:middle;margin:0 4px}
.o2{font-size:18px;padding:0 12px;border-radius:12px;border:3px solid #bac8ff;background:#fff;color:var(--violet);cursor:pointer}
.o2.sel{background:var(--violet);color:#fff;border-color:var(--violet)}
.o2.right{background:var(--green);border-color:var(--green);color:#fff}
.o2.wrong{background:#fff0f6;border-color:var(--red);color:var(--red)}
select.sel{font-size:20px;padding:2px 8px;border:3px solid #bac8ff;border-radius:12px;color:var(--violet);background:#fff}
select.sel.right{border-color:var(--green);color:var(--green);background:#ebfbee}
select.sel.wrong{border-color:var(--red);color:var(--red);background:#fff0f6}
.bigeq{font-size:26px;text-align:center;margin:14px 0;line-height:2.4}

/* ----- 분석기 ----- */
.tray{display:flex;gap:10px;flex-wrap:wrap;min-height:96px;padding:10px;border:3px dashed #bac8ff;border-radius:16px;background:#f8f9ff}
.mcard{background:#fff;border:3px solid #bac8ff;border-radius:16px;padding:6px 12px;cursor:grab;user-select:none;touch-action:none;min-width:170px}
.mcard .mtag{font-size:13px;color:var(--mute)}
.mcard .mname{font-size:18px;color:var(--ink)}
.mcard .mchg{font-size:22px;color:var(--violet)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media(max-width:760px){.slots{grid-template-columns:1fr}}
.slot{min-height:150px;border:4px dashed;border-radius:18px;padding:8px 10px}
.slot.ox{border-color:#ff8fb8;background:#fff5f9}
.slot.re{border-color:#74c0fc;background:#f1f9ff}
.slot h4{margin:0 0 4px;font-size:19px}
.placed{display:inline-block;background:#fff;border-radius:12px;padding:2px 10px;margin:3px;border:2px solid #dee2e6;font-size:17px}
.eqline{text-align:center;font-size:24px;color:var(--teal);margin:6px 0}

/* ----- 퀴즈 ----- */
.qcard{border:3px solid #d0ebff;border-radius:18px;padding:12px 16px;margin-bottom:14px;background:#fff}
.qcard.done{border-color:#8ce99a;background:#f6fff7}
.qno{color:var(--violet);font-size:20px}
.opt{display:block;width:100%;text-align:left;font-size:19px;color:var(--ink);background:#f8f9fa;border:3px solid #e9ecef;border-radius:14px;padding:6px 14px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:#bac8ff}
.opt.wrong{background:#fff0f6;border-color:#ffa8c9;color:var(--red)}
.opt.right{background:#ebfbee;border-color:#8ce99a;color:#237a34}
.opt[disabled]{cursor:default}
textarea{width:100%;font-size:19px;color:var(--ink);border:3px solid #bac8ff;border-radius:14px;padding:10px 12px;resize:vertical;line-height:1.6}
textarea:focus{outline:none;border-color:var(--violet)}
.chk{display:flex;gap:8px;align-items:flex-start;margin:3px 0;font-size:18px}
.chk .ic{width:26px;flex-shrink:0}
.sample{background:#f3f0ff;border-left:6px solid var(--violet);border-radius:10px;padding:8px 14px;margin-top:8px;color:var(--violet)}

/* ----- 리포트 ----- */
.report{background:#fff;border:4px solid #ffc078;border-radius:26px;padding:22px 26px;box-shadow:0 8px 0 #ffe8cc}
.rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:3px dashed #ffd8a8;padding-bottom:10px}
.rep-title{font-size:34px;color:var(--orange);line-height:1.2}
.rep-sub{color:var(--mute);font-size:17px}
.rep-top{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:14px 0}
.gbadge{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:64px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15);flex-shrink:0}
.rep h3{font-size:23px;color:var(--blue);margin:20px 0 6px;border-left:8px solid var(--blue);padding-left:10px}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale span{padding:1px 14px;border-radius:12px;background:#f1f3f5;color:#868e96;font-size:16px}
.scale span.me{color:#fff}
.prow{display:grid;grid-template-columns:2.2fr 1.4fr 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #f1f3f5}
@media(max-width:760px){.prow{grid-template-columns:1fr}}
.pname{font-size:18px}
.psub{font-size:15px;color:var(--mute)}
.bar{height:14px;background:#e9ecef;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%}
.stg{display:flex;gap:8px;flex-wrap:wrap}
.stg span{background:#ebfbee;color:var(--green);border-radius:12px;padding:2px 12px;font-size:17px}
.ans{background:#f8f9fa;border-radius:12px;padding:8px 14px;margin:6px 0;white-space:pre-wrap}
.fbtext p{margin:8px 0}
.plan{background:#fff9db;border:3px dashed #ffc078;border-radius:16px;padding:10px 14px}
.planitem{background:#fff;border:3px solid #ffd8a8;border-radius:14px;padding:8px 12px;margin:8px 0;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.okline{background:#ebfbee;border-radius:12px;padding:2px 12px;margin:4px 0;color:var(--green);font-size:17px}
.clearcard{text-align:center;padding:26px}
.clearcard .big{font-size:70px}
</style>
</head>
<body>

<header class="top">
  <div class="title">
    <h1>🥈 은빛 변신과 전자의 비밀</h1>
    <p>산화·환원 게임 시뮬레이션 · 고등학교 2학년 통합과학</p>

let AC=null,soundOn=true;
function tone(f,d=.12,type='sine',v=.07,delay=0){if(!soundOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const t=AC.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={ok(){tone(660,.1);tone(880,.16,'sine',.07,.09)},bad(){tone(190,.22,'sawtooth',.05)},pop(){tone(520,.06,'triangle')},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.2,'sine',.07,i*.11))},snip(){tone(900,.04,'square',.03);tone(700,.04,'square',.03,.07)},zap(){tone(1300,.08,'sawtooth',.035);tone(420,.16,'sawtooth',.035,.07)},drop(){tone(430,.09,'sine',.07)}};

/* 드래그 도우미 (마우스/터치 공용) */
function makeDrag(node,{ghost,onDrop,enabled=()=>true}){
  node.style.touchAction='none';
  node.addEventListener('pointerdown',e=>{
    if(!enabled())return; e.preventDefault();
    let g;
    if(ghost)g=ghost(node);else{g=node.cloneNode(true);g.removeAttribute('id');g.style.width=node.getBoundingClientRect().width+'px';}
    g.classList.add('dragghost');g.style.position='fixed';g.style.margin='0';g.style.right='auto';g.style.bottom='auto';document.body.appendChild(g);
    const mv=(x,y)=>{g.style.left=x+'px';g.style.top=y+'px'};mv(e.clientX,e.clientY);
    node.classList.add('dragging');
    const sx=e.clientX,sy=e.clientY;
    const move=ev=>mv(ev.clientX,ev.clientY);
    const up=ev=>{
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
      g.remove();node.classList.remove('dragging');
      let tgt=null;
      for(const n of document.elementsFromPoint(ev.clientX,ev.clientY)){const t=n.closest&&n.closest('[data-drop]');if(t){tgt=t;break}}
      onDrop(tgt,{x:ev.clientX,y:ev.clientY,moved:Math.hypot(ev.clientX-sx,ev.clientY-sy)});
    };
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  });
}

function tween(from,to,ms,fn,end){const t0=performance.now();(function f(t){const p=clamp((t-t0)/ms,0,1);fn(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f);else if(end)end()})(t0)}

  p2:{name:'구리 → 은 이온 전자 이동과 산화·환원 판단',max:15,pen:.12,stage:'Stage 2'},

};

const CAP=.92;          // 보충 시뮬레이션으로 얻을 수 있는 한 과정의 최대 비율
const DEF=.9;           // 이 비율 미만이면 '부족한 수행과정'
const GRADES=[['A',90,'#2b9a44','탁월'],['B',80,'#1c7ed6','우수'],['C',70,'#e8590c','보통'],['D',60,'#d6336c','미흡'],['F',0,'#868e96','재도전']];
const gradeOf=t=>GRADES.find(g=>t>=g[1]);

let S;
const idLabel=()=>`${S.grade}학년 ${S.cls}반 ${S.num}번`;
function initState(){
  S={name:'',grade:0,cls:0,num:0,tab:'intro',unlocked:{intro:true,s1:false,s2:false,s3:false,s4:false,quiz:false,result:false},
     done:{s1:false,s2:false,s3:false,s4:false,quiz:false},mounted:{},
     p:{},mcq:MCQ.map(()=>({wrong:0,credit:0,done:false,retry:0})),wr:WQ.map(()=>({text:'',score:null,items:[],att:0,firstMissing:[],retry:0}))};
  ['p1','p2','p3','p4','p5'].forEach(k=>S.p[k]={rec:null,score:null,scored:false,retry:0});
}
const newRec=()=>({err:0,hint:0,tags:{}});
function tag(rec,t,w=1){rec.tags[t]=(rec.tags[t]||0)+w;rec.err+=w}
const fracOf=(rec,pen)=>clamp(1-rec.err*pen-rec.hint*.05,.3,1);
function applyFirst(id,rec){const P=S.p[id];if(P.scored)return;P.rec=rec;P.score=PARTS[id].max*fracOf(rec,PARTS[id].pen);P.scored=true}
function applyRetry(id,rec){const P=S.p[id],M=PARTS[id].max;const raw=M*fracOf(rec,PARTS[id].pen);const credit=Math.min(raw,M*CAP);const before=P.score;P.retry++;P.lastRec=rec;if(credit>P.score)P.score=credit;return{before,after:P.score}}
function partScore(id){
  if(id==='p6')return S.mcq.reduce((a,q)=>a+q.credit,0);
  if(id==='p7')return S.wr.reduce((a,w)=>a+(w.score||0),0);
  return S.p[id].score||0;
}
const totalScore=()=>ORDER.reduce((a,id)=>a+partScore(id),0);
const isDef=id=>partScore(id)<PARTS[id].max*DEF-1e-6;
const gainOf=id=>Math.max(0,PARTS[id].max*CAP-partScore(id));

    makeDrag(pc,{ghost:()=>{const d=document.createElement('div');d.style.width='90px';d.innerHTML=shapeSvg(shape);return d},onDrop:(t)=>{

    dr.animate([{transform:'translateY(0)'},{transform:'translateY(96px)'}],{duration:420,easing:'ease-in'});sfx.drop();await sleep(420);dr.setAttribute('opacity',0);

  const deselect=()=>{if(selected){selected.classList.remove('selected');selected=null}};
  const selectEl=e=>{if(finished||e.classList.contains('used'))return;if(selected===e){deselect();return}if(selected)selected.classList.remove('selected');selected=e;e.classList.add('selected');sfx.pop();say(box,'⚡ 전자를 선택했어요! 이제 산소의 <span class="k-r">빈자리(점선 ○)</span>를 눌러 전달하세요.','info')};
  const toO=e=>{
    const p=sl[moved];e.classList.add('used');moved++;sfx.zap();
    $('#oFill',box).insertAdjacentHTML('beforeend',`<g><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="9" fill="#ffd43b" stroke="#f08c00" stroke-width="2.5"/></g>`);
    $$('.slotg',box)[moved-1].style.opacity=.25;
    $('#mgChg',box).textContent='전하 +'+moved;$('#oChg',box).textContent='전하 −'+moved;
    $('#iMg',box).innerHTML=`Mg 전하 : <span class="k-o">+${moved}</span>`;$('#iO',box).innerHTML=`O 전하 : <span class="k-r">−${moved}</span>`;
    if(moved<2)say(box,'⚡ 전자 1개 이동! 산소의 빈자리가 하나 더 남았어요.','ok');else finish();
  };
  els.forEach(e=>{
    makeDrag(e,{ghost:eghost,enabled:()=>!finished&&!e.classList.contains('used'),onDrop:(t,info)=>{
      if(!t||t.dataset.drop!=='O'){if(info.moved<12){selectEl(e)}else if(info.moved>50){tag(rec,'miss',.5);say(box,'전자는 <span class="k-r">산소 원자의 빈자리</span>로 가야 해요!','bad');sfx.bad()}return}
      deselect();toO(e);
    }});
  });
  oTargets.forEach(g=>g.addEventListener('click',()=>{
    if(finished||moved>=2)return;
    if(!selected){say(box,'먼저 <span class="k-o">전자(e⁻)</span>를 눌러 선택한 뒤, 산소의 빈자리를 눌러 주세요.','info');return}
    const e=selected;deselect();toO(e);
  }));
  async function finish(){
    finished=true;sfx.ok();say(box,'⚡ 전자 2개 이동 완료! Mg와 O에 어떤 변화가 생길까요?','ok');await sleep(700);
    $('#ring3',box).style.opacity=0;$('#ring3',box).style.transition='opacity .8s';
    $('#mgT',box).textContent='Mg²⁺';$('#mgT',box).setAttribute('font-size',15);$('#mgL',box).textContent='Mg²⁺ (전자 2·8)';$('#mgL',box).setAttribute('fill','#1c7ed6');
    $('#oT',box).textContent='O²⁻';$('#oT',box).setAttribute('font-size',15);$('#oL',box).textContent='O²⁻ (전자 2·8)';$('#oL',box).setAttribute('fill','#d6336c');
    await sleep(900);
    $('#mgG',box).style.transform='translate(300px,215px)';$('#oG',box).style.transform='translate(440px,215px)';sfx.pop();
    await sleep(1400);$('#bondTxt',box).style.opacity=1;sfx.win();
    const eq=$('#eqbox',box);eq.style.display='';
    eq.innerHTML='<span class="k-o">Mg</span> → <span class="k-b">Mg²⁺</span> + 2e⁻ <span class="mute" style="font-size:17px">(전자를 잃음)</span><br><span class="k-r">O</span> + 2e⁻ → <span class="k-r">O²⁻</span> <span class="mute" style="font-size:17px">(전자를 얻음)</span><hr style="border:1px dashed #b197fc"><div class="mute" style="font-size:17px">완성된 화학 반응식 (계수 포함)</div><span class="k-o">2Mg</span> + <span class="k-r">O₂</span> → <span class="k-g">2MgO</span><div class="mute" style="font-size:16px">※ 위 장면은 Mg 1개와 O 1개의 이동이에요. 실제 반응식은 이 장면이 2번 일어난 것과 같아요.</div>';
    say(box,'✅ 마그네슘은 전자 2개를 잃어 <span class="k-b">Mg²⁺</span>, 산소는 전자 2개를 얻어 <span class="k-r">O²⁻</span>가 되고, 서로 끌어당겨 <span class="k-g">산화 마그네슘(MgO)</span>을 이뤄요.','ok');
    $('#nextBtn',box).style.display='';$('#hintBtn',box).style.display='none';
  }
  $('#hintBtn',box).onclick=()=>{rec.hint++;say(box,'💡 Mg의 바깥 껍질에는 전자가 <span class="k-o">2개</span>, 산소의 바깥 껍질은 전자가 <span class="k-r">6개</span>라 <span class="k-r">2개가 부족</span>해요. 부족한 자리(점선)로 옮겨 주세요.','info')};
  $('#nextBtn',box).onclick=next;
}

  };
  let phase=1,left=new Set(['c1','c2','c3','c4']);
  box.innerHTML=mission('🧬','전자 스캐너 가동! 변화 카드를 <span class="k-r">전자를 잃는 반응 = 산화</span>, <span class="k-b">전자를 얻는 반응 = 환원</span> 칸에 알맞게 끌어다 놓으세요.')+`

    <div class="slot re" data-drop="re"><h4><span class="k-b">전자를 얻는 반응 = 환원</span></h4><div id="bodyRe"></div></div>
   </div>

  </div>`;
  const tray=$('#tray',box);

    shuffle(ids).forEach(id=>{
      const c=C[id],d=document.createElement('div');d.className='mcard';d.dataset.id=id;
      d.innerHTML=`<div class="mtag">${c.stage}</div><div class="mname">${c.name}</div><div class="mchg">${c.chg}</div>`;

        sfx.zap();d.remove();left.delete(id);

  $('#nextBtn',box).onclick=()=>done(rec);

 {topic:'수용액 색 변화',q:'구리 테이프를 넣은 질산 은 수용액이 점차 푸른빛을 띠는 까닭으로 가장 알맞은 것은?',

/* 서술형 채점 (핵심어 기반) */
const CU_=/(구리|Cu)/,AG_=/(은이온|Ag)/,MG_=/(마그네슘|Mg)/,O_=/(산소|(^|[^A-Za-z])O)/;
const LOSE=/(잃|내놓|내주|내어|내보|방출|빼앗기|주고|준다|주어|줘)/,GAIN=/(얻|받|가져|가지|흡수)/;
function prep(t){const n=t.replace(/\s+/g,'').replace(/⁺/g,'+').replace(/⁻/g,'-').replace(/²/g,'2').replace(/₂/g,'2').replace(/₃/g,'3');return{n,cl:n.split(/[.,;。!?\n]|되고|되며|이고|이며|으며|하고|지만|반면|한편|그리고/).filter(Boolean)}}
const WQ=[
 {q:'질산 은 수용액에 담근 구리 테이프 표면에서 일어나는 변화를 <span class="k-r">전자의 이동</span>을 이용해 설명하시오. (산화되는 물질과 환원되는 물질을 반드시 포함할 것)',
  sample:'구리(Cu)는 전자 2개를 잃고 Cu²⁺가 되어 수용액에 녹아 나오므로 산화된다. 은 이온(Ag⁺)은 구리가 내놓은 전자를 1개씩 얻어 은(Ag)이 되어 구리 표면에 석출되므로 환원된다. 즉 전자가 구리에서 은 이온으로 이동하며, 산화와 환원은 동시에 일어난다.',
  rub:[
   {l:'구리가 전자를 잃는다',p:2,f:'구리(Cu)가 전자를 <span class="k-r">잃는다(내놓는다)</span>는 설명이 필요해요. Cu → Cu²⁺ + 2e⁻ 를 떠올려 보세요.',
    t:({n,cl})=>cl.some(c=>CU_.test(c)&&LOSE.test(c)&&!/(구리|Cu)(는|가|이|은)?전자를?얻/.test(c))||/Cu(→|->|=>|=)Cu2\+\+?2e/.test(n)},
   {l:'구리가 산화된다',p:2,f:'전자를 잃는 구리는 <span class="k-r">산화</span>된다고 써야 해요.',
    t:({n,cl})=>cl.some(c=>CU_.test(c)&&/산화/.test(c)&&!/환원/.test(c))||/산화(되는|된)?(물질|것)(은|는|이)?(구리|Cu)/.test(n)},
   {l:'은 이온이 전자를 얻는다',p:2,f:'은 이온(Ag⁺)이 전자를 <span class="k-r">얻어</span> 은(Ag)이 된다는 설명이 빠졌어요.',
    t:({n,cl})=>cl.some(c=>AG_.test(c)&&GAIN.test(c)&&/전자/.test(c))||/Ag\+\+?e-?(→|->|=>)Ag/.test(n)},
   {l:'은 이온이 환원된다',p:2,f:'전자를 얻는 은 이온은 <span class="k-r">환원</span>된다고 써야 해요.',
    t:({n,cl})=>cl.some(c=>AG_.test(c)&&/환원/.test(c)&&!/산화/.test(c))||/환원(되는|된)?(물질|것)(은|는|이)?(은이온|Ag)/.test(n)},
   {l:'전자의 이동을 언급',p:1,f:'전자가 구리에서 은 이온으로 <span class="k-r">이동</span>한다는 표현을 넣어 보세요.',
    t:({n})=>/전자/.test(n)&&/(이동|전달|주고받|건네|넘어|옮겨|→)/.test(n)},
   {l:'동시에 일어남을 언급',p:1,f:'산화와 환원이 <span class="k-r">동시에</span> 일어난다는 점도 덧붙여 보세요.',t:({n})=>/동시/.test(n)}
  ]},
 {q:'마그네슘의 연소 반응(2Mg + O₂ → 2MgO)에서 <span class="k-r">전자의 이동 방향</span>을 설명하고, Mg와 O가 각각 산화·환원 중 무엇에 해당하는지 쓰시오. 그리고 두 반응(구리와 은 이온, 마그네슘의 연소)에서 알 수 있는 산화와 환원의 공통점을 한 문장으로 쓰시오.',
  sample:'마그네슘(Mg)은 전자 2개를 잃고 Mg²⁺가 되므로 산화되고, 산소(O)는 그 전자를 얻어 O²⁻가 되므로 환원된다. 전자는 Mg에서 O로 이동하며, Mg²⁺와 O²⁻가 이온 결합하여 MgO가 생성된다. 두 반응 모두 산화와 환원은 전자의 이동으로 동시에 일어난다는 공통점이 있다.',
  rub:[
   {l:'마그네슘이 전자를 잃는다',p:2,f:'마그네슘(Mg)이 전자 2개를 <span class="k-r">잃는다</span>는 설명이 필요해요.',
    t:({n,cl})=>cl.some(c=>MG_.test(c)&&LOSE.test(c)&&!/(마그네슘|Mg)(는|가|이|은)?전자를?얻/.test(c))||/Mg(→|->|=>|=)Mg2\+\+?2e/.test(n)},
   {l:'마그네슘이 산화된다',p:2,f:'전자를 잃는 마그네슘은 <span class="k-r">산화</span>돼요.',
    t:({n,cl})=>cl.some(c=>MG_.test(c)&&/산화/.test(c)&&!/환원/.test(c)&&!/산화마그네슘/.test(c))||/산화(되는|된)?(물질|것)(은|는|이)?(마그네슘|Mg)/.test(n)||cl.some(c=>MG_.test(c)&&/산화(된|되)/.test(c))},
   {l:'산소가 전자를 얻는다',p:2,f:'산소(O)가 마그네슘이 내놓은 전자를 <span class="k-r">얻는다</span>는 설명이 빠졌어요.',
    t:({cl})=>cl.some(c=>O_.test(c)&&GAIN.test(c)&&/전자/.test(c))},
   {l:'산소가 환원된다',p:2,f:'전자를 얻는 산소는 <span class="k-r">환원</span>돼요.',
    t:({n,cl})=>cl.some(c=>O_.test(c)&&/환원/.test(c)&&!/산화(?!마그네슘)/.test(c.replace(/산화마그네슘/g,'')))||/환원(되는|된)?(물질|것)(은|는|이)?(산소|O)/.test(n)},
   {l:'전자의 이동 방향(Mg → O)',p:1,f:'전자가 <span class="k-r">Mg에서 O로 이동</span>한다는 방향을 밝혀 주세요.',
    t:({n})=>/전자/.test(n)&&/(이동|전달|주고받|건네|넘어|옮겨|→)/.test(n)},
   {l:'공통점 : 동시에 일어남',p:1,f:'두 반응의 공통점은 산화와 환원이 전자의 이동으로 <span class="k-r">동시에</span> 일어난다는 것이에요.',t:({n})=>/동시/.test(n)}
  ]}
];
function evalWritten(i,text){
  const pr=prep(text),items=WQ[i].rub.map(r=>({l:r.l,p:r.p,f:r.f,ok:!!r.t(pr)}));
  return{score:items.reduce((a,x)=>a+(x.ok?x.p:0),0),items};
}
const mcqCredit=w=>4*[1,.6,.3][Math.min(w,2)];

/* 객관식 블록 (첫 도전 / 보충 공용) */
function renderMCQ(container,idxs,mode,onChange){
  container.innerHTML=idxs.map(i=>{const q=MCQ[i];return `<div class="qcard" data-i="${i}"><div class="qno">Q${i+1}. <span class="mute" style="font-size:15px">(${q.topic})</span></div><div>${q.q}</div>${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${'①②③④'[k]} ${o}</button>`).join('')}<div class="msg" data-fb style="display:none"></div></div>`}).join('');
  const local={};
  $$('.qcard',container).forEach(card=>{
    const i=+card.dataset.i,q=MCQ[i];local[i]=0;
    $$('.opt',card).forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,fb=$('[data-fb]',card);fb.style.display='';
      if(k===q.a){
        $$('.opt',card).forEach(x=>x.disabled=true);b.classList.add('right');card.classList.add('done');sfx.ok();
        fb.className='msg ok';fb.innerHTML='⭕ 정답! '+q.exp;
        const m=S.mcq[i];
        if(mode==='first'){m.wrong=local[i];m.credit=mcqCredit(local[i]);m.done=true}
        else{m.retry++;m.credit=Math.max(m.credit,4*CAP*(local[i]===0?1:.7))}
        onChange&&onChange();
      }else{
        local[i]++;b.classList.add('wrong');b.disabled=true;sfx.bad();fb.className='msg bad';fb.innerHTML='❌ '+q.fb[k];
      }
    });
  });
}
/* 서술형 블록 */
function renderWritten(container,idxs,mode,onChange){
  container.innerHTML=idxs.map(i=>`<div class="qcard" data-w="${i}"><div class="qno">서술형 ${i+1}</div><div style="margin-bottom:6px">${WQ[i].q}</div><textarea rows="5" placeholder="여기에 답을 써 보세요. (20자 이상)">${mode==='retry'?(S.wr[i].text||'').replace(/</g,'&lt;'):''}</textarea><div class="btnrow"><button class="btn small violet" data-ev>✍ 제출하고 점검받기</button><button class="btn small ghost" data-sm style="display:none">📖 모범 답안 보기</button></div><div data-res></div></div>`).join('');
  $$('.qcard',container).forEach(card=>{
    const i=+card.dataset.w,ta=$('textarea',card),res=$('[data-res]',card);
    $('[data-sm]',card).onclick=()=>{const s=$('.sample',card);if(s){s.remove();return}res.insertAdjacentHTML('beforeend',`<div class="sample">📖 모범 답안 : ${WQ[i].sample}</div>`)};
    $('[data-ev]',card).onclick=()=>{
      const t=ta.value.trim();
      if(t.length<20){res.innerHTML='<div class="msg bad">조금 더 자세히 써 볼까요? (20자 이상)</div>';sfx.bad();return}
      const r=evalWritten(i,t),w=S.wr[i];w.att++;
      let shown=r.score;
      if(mode==='first'){w.text=t;w.score=r.score;w.items=r.items;if(w.att===1)w.firstMissing=r.items.filter(x=>!x.ok).map(x=>x.l)}
      else{const credit=Math.min(r.score,10*CAP);shown=credit;w.retry++;if(credit>=(w.score||0)){w.score=credit;w.text=t;w.items=r.items}}
      const miss=r.items.filter(x=>!x.ok);
      res.innerHTML=`<div class="msg ${miss.length?'info':'ok'}" style="margin-top:8px">${mode==='retry'?'보충 채점':'채점 결과'} : <span class="k-r">${fmt(shown)}점</span> / 10점${mode==='retry'&&shown<r.score?` <span class="mute">(보충 수행 최대 ${fmt(10*CAP)}점)</span>`:''}</div>`+
        r.items.map(x=>`<div class="chk"><span class="ic">${x.ok?'✅':'⬜'}</span><span>${x.ok?`<span class="k-g">${x.l}</span>`:`<span class="k-r">${x.l}</span> — ${x.f}`}</span></div>`).join('')+
        (miss.length?'<div class="mute" style="font-size:16px;margin-top:4px">빠진 부분을 보완해서 다시 제출할 수 있어요.</div>':'<div class="okline">완벽해요! 핵심 내용을 모두 담았어요.</div>');
      $('[data-sm]',card).style.display='';sfx[miss.length?'pop':'win']();
      onChange&&onChange();
    };
  });
}
function mountQuiz(){
  const box=shell('quiz','학습 점검','⑤ 학습 점검 퀴즈 & 서술형');
  box.innerHTML=mission('📚','배운 내용을 확인해요! <span class="k-r">틀리면 이유를 알려 주니</span> 차근차근 다시 골라 보세요. 서술형은 <span class="k-r">핵심어</span>를 기준으로 점검해 줘요.')+`
  <div class="card"><h3 style="margin:0 0 8px;color:var(--violet);font-size:23px">A. 객관식 (5문항)</h3><div id="mcqBox"></div></div>
  <div class="card"><h3 style="margin:0 0 8px;color:var(--violet);font-size:23px">B. 서술형 (2문항)</h3><div id="wrBox"></div></div>
  <div class="card"><div class="msg info" id="msg">객관식을 모두 맞히고 서술형을 두 문항 모두 제출하면 <span class="k-r">미션 성공</span> 탭이 열려요.</div><div class="btnrow"><button class="btn orange glow" id="finBtn" disabled>🏆 미션 성공 확인하기</button></div></div>`;
  const chk=()=>{
    const m=S.mcq.every(q=>q.done),w=S.wr.every(x=>x.att>0&&x.score!==null);

    say(box,m&&w?'✅ 모든 문항을 완료했어요! 버튼을 눌러 결과를 확인해요.':`진행 상황 : 객관식 ${S.mcq.filter(q=>q.done).length}/5 · 서술형 ${S.wr.filter(x=>x.att>0).length}/2`,m&&w?'ok':'info');
  };
  renderMCQ($('#mcqBox',box),[0,1,2,3,4],'first',chk);
  renderWritten($('#wrBox',box),[0,1],'first',chk);
  $('#finBtn',box).onclick=()=>{S.done.quiz=true;unlock('result');sfx.win();go('result')};
}

/* =====================================================================
   미션 성공 (결과 리포트)
===================================================================== */
function partIssues(id){
  const P=S.p[id],t=P&&P.rec?P.rec.tags:{},r=[];
  const n=k=>Math.round(t[k]||0);
  if(id==='p1'){if(n('order'))r.push(`착용 순서(<span class="k-r">실험복 → 보안경 → 고무장갑</span>)를 헷갈려 ${n('order')}번 정정했어요`);if(n('wrongItem'))r.push(`슬리퍼·헤드폰처럼 실험에 부적절한 복장을 ${n('wrongItem')}번 골랐어요`)}
  if(id==='p2'){
    if(t.wrongTarget)r.push('전자를 (+)전하의 은 이온이 아닌 <span class="k-r">구경꾼 이온(NO₃⁻)</span>에게 주려 한 적이 있어요');
    if(t.dup)r.push('이미 전자를 받은 은 원자에 다시 전자를 옮기려 했어요');
    if(t.miss)r.push('전자를 이온 위에 정확히 옮기지 못한 시도가 있었어요');
    if(t.cuDir||t.cuOx)r.push('구리가 <span class="k-r">전자를 잃어 산화</span>된다는 판단이 흔들렸어요');
    if(t.agDir||t.agRed)r.push('은 이온이 <span class="k-r">전자를 얻어 환원</span>된다는 판단이 흔들렸어요');
    if(t.simul)r.push('산화와 환원이 <span class="k-r">동시에</span> 일어난다는 점을 놓쳤어요');
  }
  if(id==='p3'&&t.miss)r.push('마그네슘의 전자를 산소의 빈자리로 옮기는 과정에서 시행착오가 있었어요');
  if(id==='p4'){if(t.coef)r.push('완성된 반응식의 <span class="k-r">계수(반응하는 입자 수의 비)</span>를 읽는 데 오답이 있었어요');if(t.ecount)r.push('이동한 <span class="k-r">전자의 총 개수(2Mg → 4e⁻)</span>를 세는 데 오답이 있었어요')}
  if(id==='p5'){if(t.oxToRe)r.push(`전자를 <span class="k-r">잃는</span> 물질을 환원 칸에 ${Math.round(t.oxToRe)}번 놓았어요 (잃음 = 산화)`);if(t.reToOx)r.push(`전자를 <span class="k-r">얻는</span> 물질을 산화 칸에 ${Math.round(t.reToOx)}번 놓았어요 (얻음 = 환원)`)}
  if(id==='p6'){const m=S.mcq.map((q,i)=>q.wrong>0?MCQ[i].topic:null).filter(Boolean);if(m.length)r.push(`첫 시도에서 틀린 문항 : ${m.join(', ')}`)}
  if(id==='p7'){S.wr.forEach((w,i)=>{if(w.firstMissing.length)r.push(`서술형 ${i+1}에서 빠졌던 핵심 : ${w.firstMissing.join(', ')}`)})}
  if(P&&P.rec&&P.rec.hint)r.push(`힌트를 ${P.rec.hint}번 사용했어요`);
  return r;
}
function partNote(id){
  if(id==='p6')return `첫 시도 정답 ${S.mcq.filter(q=>q.wrong===0).length}/5`;
  if(id==='p7')return S.wr.map((w,i)=>`서술형${i+1} ${fmt(w.score||0)}/10`).join(' · ');
  const P=S.p[id],r=P.rec;return `오류 ${fmt(r?r.err:0)}회 · 힌트 ${r?r.hint:0}회`+(P.retry?` · 보충 ${P.retry}회`:'');
}
const retried=id=>id==='p6'?S.mcq.some(q=>q.retry):id==='p7'?S.wr.some(w=>w.retry):S.p[id].retry>0;
const GMSG={A:'전자의 이동을 바탕으로 산화·환원을 매우 정확하게 이해하고 있어요. 실험 과정도 안정적이었습니다.',B:'핵심 개념을 잘 이해하고 있어요. 몇 가지 부족한 과정만 보완하면 A단계에 도달할 수 있어요.',C:'기본 개념은 이해했지만 헷갈리는 부분이 남아 있어요. 부족한 수행 과정을 보충해 봅시다.',D:'산화·환원 개념이 아직 흔들리고 있어요. 아래 보충 시뮬레이션으로 기초부터 차근차근 다져 봅시다.',F:'개념을 다시 익힐 필요가 있어요. 부족한 과정부터 하나씩 보충 시뮬레이션을 진행해 봅시다.'};
function buildFeedback(total,g){
  const strong=ORDER.filter(id=>!isDef(id)),weak=ORDER.filter(isDef);
  let h=`<p><span class="k-o">${idLabel()}</span> <span class="k-v">${S.name}</span> 학생은 「은빛 변신과 전자의 비밀」의 모든 스테이지와 학습 점검을 마치고 종합 <span class="k-r">${Math.round(total)}점, ${g[0]}단계(${g[3]})</span>를 받았습니다. ${GMSG[g[0]]}</p>`;
  if(strong.length)h+=`<p><span class="k-g">잘한 점</span> : ${strong.map(id=>'<span class="k-b">'+PARTS[id].name+'</span>').join(', ')} 과정을 안정적으로 수행했습니다.${strong.some(retried)?' 특히 보충 시뮬레이션에 다시 도전해 부족했던 부분을 스스로 고쳐 낸 점이 돋보입니다.':''}</p>`;
  else h+=`<p><span class="k-g">잘한 점</span> : 끝까지 모든 미션을 완주한 것이 가장 큰 성과입니다. 이제 아래의 보충 과정으로 하나씩 채워 봅시다.</p>`;
  if(weak.length){
    h+=`<p><span class="k-o">보완할 점</span></p>`;
    weak.forEach(id=>{const is=partIssues(id);h+=`<p>• <span class="k-b">${PARTS[id].name}</span> (${fmt(partScore(id))}/${PARTS[id].max}점) : ${is.length?is.join(' / ')+'.':'전반적인 정확도를 조금 더 높여 보세요.'}</p>`});
  }else h+=`<p><span class="k-o">보완할 점</span> : 뚜렷한 부족 과정이 없습니다. 지금의 이해를 다른 산화·환원 반응(예: 철의 부식, 연소)에도 적용해 보세요.</p>`;
  const w1=S.wr[0],w2=S.wr[1];
  h+=`<p><span class="k-t">서술형 총평</span> : 서술형 1은 ${fmt(w1.score||0)}점, 서술형 2는 ${fmt(w2.score||0)}점입니다. `+(((w1.score||0)+(w2.score||0))>=18?'구리·은 이온·마그네슘·산소가 전자를 잃거나 얻는 과정을 용어와 함께 논리적으로 설명했습니다.':'"어떤 물질이 전자를 잃고(산화), 어떤 물질이 전자를 얻는지(환원)"를 짝지어 쓰면 더 정확한 설명이 됩니다.')+`</p>`;
  const rc=ORDER.reduce((a,id)=>a+(id==='p6'?S.mcq.reduce((x,q)=>x+q.retry,0):id==='p7'?S.wr.reduce((x,w)=>x+w.retry,0):S.p[id].retry),0);
  if(rc)h+=`<p><span class="k-g">보충 수행 이력</span> : 보충 시뮬레이션에 총 ${rc}회 도전했습니다. 틀린 부분만 다시 도전하는 태도가 좋은 학습 습관입니다.</p>`;
  h+=`<p><span class="k-v">핵심 정리</span> : <span class="k-o">산화</span>는 전자를 <span class="k-r">잃는</span> 변화, <span class="k-b">환원</span>은 전자를 <span class="k-r">얻는</span> 변화이며, 두 변화는 전자의 이동으로 <span class="k-r">동시에</span> 일어납니다.</p>`;
  return h;
}
function renderResult(){
  const total=totalScore(),g=gradeOf(Math.round(total)),today=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});
  const weak=ORDER.filter(isDef).sort((a,b)=>gainOf(b)-gainOf(a));
  const potential=total+weak.reduce((a,id)=>a+gainOf(id),0);
  const nextG=[...GRADES].reverse().find(x=>x[1]>Math.round(total));
  let plan='';
  if(!weak.length)plan='<div class="okline" style="font-size:19px">🎉 부족한 수행 과정이 없어요! 모든 과정이 충분히 안정적입니다.</div>';
  else{
    const reach=nextG?(potential>=nextG[1]?`아래 과정을 모두 보충하면 <span class="k-r">${gradeOf(Math.round(potential))[0]}단계</span>까지 올릴 수 있어요.`:`아래 과정을 모두 보충하면 최대 약 <span class="k-r">${Math.round(potential)}점</span>까지 올릴 수 있어요.`):'';
    plan=`<p style="margin:0 0 6px">${nextG?`현재 <span class="k-r">${g[0]}단계</span> → <span class="k-b">${nextG[0]}단계</span>까지 <span class="k-r">${Math.max(1,nextG[1]-Math.round(total))}점</span> 남았어요. `:''}${reach}<br><span class="k-v">전체를 다시 할 필요 없이</span>, 부족했던 아래 과정만 골라 보충 시뮬레이션을 수행하면 돼요.</p>`+
    weak.map((id,i)=>`<div class="planitem"><div><span class="k-o">${i===0?'🥇 우선순위 1 · ':''}${PARTS[id].stage}</span> <span class="k-b">${PARTS[id].name}</span><div class="psub">현재 ${fmt(partScore(id))}/${PARTS[id].max}점 · 보충 성공 시 최대 <span class="k-r">+${fmt(gainOf(id))}점</span></div></div><span data-html2canvas-ignore="true"><button class="btn small orange" data-re="${id}">🔁 보충하기</button></span></div>`).join('')+
    ORDER.filter(id=>!isDef(id)).map(id=>`<div class="okline">✅ ${PARTS[id].name} — 충분해요. 다시 할 필요 없어요!</div>`).join('');
  }
  const html=`
  <div class="report" id="reportCard">
   <div class="rep-head">
    <div><div class="rep-title">🏆 MISSION SUCCESS</div><div class="rep-sub">은빛 변신과 전자의 비밀 · 산화·환원 게임 시뮬레이션 (고등학교 2학년 통합과학)</div></div>
    <div class="brand"><img src="${$('#brandimg').src}" alt="EARTH LJY 로고"><div class="mail">earthljy@ai.jne.kr</div></div>
   </div>
   <div class="rep-top">
    <div class="gbadge" style="background:${g[2]}">${g[0]}</div>
    <div><div style="font-size:26px"><span class="k-o">${idLabel()}</span> <span class="k-v">${S.name}</span> 학생</div><div class="mute">${today} 수행 · 종합 <span class="k-r" style="font-size:26px">${Math.round(total)}</span> / 100점 · <span style="color:${g[2]}">${g[0]}단계 (${g[3]})</span></div>
    <div class="scale" style="margin-top:6px">${GRADES.map(x=>`<span class="${x[0]===g[0]?'me':''}" style="${x[0]===g[0]?'background:'+x[2]:''}">${x[0]} ${x[0]==='F'?'60미만':x[1]+'점~'}</span>`).join('')}</div></div>
   </div>
   <h3>① 스테이지 클리어 현황</h3>
   <div class="stg"><span>⭐ Stage 1 안전 실험실</span><span>⭐ Stage 2 은빛 변신</span><span>⭐ Stage 3 불꽃 속 전자</span><span>⭐ Stage 4 전자 분석기</span><span>⭐ 학습 점검</span></div>
   <h3>② 수행 과정 평가 (A · B · C · D · F)</h3>
   ${ORDER.map(id=>{const sc=partScore(id),M=PARTS[id].max,pc=sc/M,col=pc>=DEF?'#2b9a44':pc>=.7?'#e8590c':'#d6336c';return `<div class="prow"><div><div class="pname">${PARTS[id].name}</div><div class="psub">${PARTS[id].stage} · ${partNote(id)}</div></div><div class="bar"><i style="width:${Math.round(pc*100)}%;background:${col}"></i></div><div style="color:${col}">${fmt(sc)} / ${M}점 ${pc>=DEF?'✅':'⚠'}</div></div>`}).join('')}
   <h3>③ 나의 서술형 답안</h3>
   ${S.wr.map((w,i)=>`<div class="k-v">서술형 ${i+1} <span class="mute">(${fmt(w.score||0)}/10점)</span></div><div class="mute" style="font-size:16px">${WQ[i].q}</div><div class="ans">${(w.text||'').replace(/</g,'&lt;')}</div>`).join('')}
   <h3>④ 수행 과정 피드백</h3>
   <div class="fbtext">${buildFeedback(total,g)}</div>
   <h3>⑤ 등급 상향을 위한 보충 안내</h3>
   <div class="plan">${plan}</div>
   <div class="mute" style="text-align:right;margin-top:14px;font-size:15px">© EARTH LJY · earthljy@ai.jne.kr</div>
  </div>
  <div class="btnrow" style="margin-top:16px">
   <button class="btn green" id="dlBtn">📥 결과 이미지(PNG)로 저장</button>
   <button class="btn ghost" id="restartBtn">↺ 처음부터 다시 하기</button>
  </div>
  <div class="msg" id="msg" style="display:none"></div>`;
  $('#panel-result').innerHTML=html;
  $$('[data-re]').forEach(b=>b.onclick=()=>startReinf(b.dataset.re));
  $('#dlBtn').onclick=downloadImg;
  $('#restartBtn').onclick=()=>{if(confirm('처음부터 다시 시작할까요? (지금까지의 기록이 사라져요)'))location.reload()};
}
async function downloadImg(){
  const m=$('#panel-result #msg');m.style.display='';
  if(typeof html2canvas==='undefined'){m.className='msg bad';m.innerHTML='이미지 저장 도구를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 다시 시도하거나, 화면 캡처를 이용해 주세요.';return}
  m.className='msg info';m.textContent='이미지를 만드는 중이에요…';
  try{
    const cv=await html2canvas($('#reportCard'),{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const a=document.createElement('a');a.download=`산화환원_미션결과_${S.grade}학년${S.cls}반${S.num}번_${S.name}.png`;a.href=cv.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();
    m.className='msg ok';m.textContent='✅ 이미지가 저장되었어요!';sfx.ok();
  }catch(e){m.className='msg bad';m.textContent='이미지 저장 중 문제가 생겼어요. 화면 캡처를 이용해 주세요.'}
}

/* =====================================================================
   보충 시뮬레이션 (부족한 과정만 다시)
===================================================================== */
function startReinf(id){
  const p=$('#panel-reinf');
  p.innerHTML=`<div class="stagehead"><div><span class="chip">🔁 보충 시뮬레이션</span><h2>${PARTS[id].name}</h2></div><button class="btn ghost small" id="backRep">← 리포트로 돌아가기</button></div>
   <div class="card" style="padding:10px 16px">부족했던 <span class="k-r">이 과정만</span> 다시 도전해요! 성공하면 점수가 올라가요. (보충으로 얻을 수 있는 점수는 이 과정 만점의 최대 ${Math.round(CAP*100)}%)</div><div id="gb-reinf"></div>`;
  $('#backRep').onclick=()=>go('result');
  go('reinf');
  const b=$('#gb-reinf');
  const fin=(before,after)=>{
    sfx.win();b.innerHTML=`<div class="card clearcard"><div class="big">${after>before+1e-6?'📈':'💪'}</div><p style="font-size:22px">보충 완료! <span class="k-b">${PARTS[id].name}</span><br>${fmt(before)}점 → <span class="k-r">${fmt(after)}점</span> ${after>before+1e-6?'':'<span class="mute" style="font-size:17px">(이번엔 점수가 오르지 않았어요. 힌트 없이 실수 없이 다시 도전해 보세요!)</span>'}</p><button class="btn green glow" id="toRep">📊 리포트에서 결과 확인</button></div>`;
    $('#toRep').onclick=()=>go('result');
  };
  const before=partScore(id);
  if(id==='p1')gameDress(b,rec=>{const r=applyRetry('p1',rec);fin(r.before,r.after)});
  else if(id==='p2'){const rec=newRec();gameCuMicro(b,rec,()=>gameCuJudge(b,rec,()=>{const r=applyRetry('p2',rec);fin(r.before,r.after)}))}
  else if(id==='p3'){const rec=newRec();gameMgMicro(b,rec,()=>{const r=applyRetry('p3',rec);fin(r.before,r.after)})}
  else if(id==='p4'){const rec=newRec();gameMgEq(b,rec,()=>{const r=applyRetry('p4',rec);fin(r.before,r.after)})}
  else if(id==='p5')gameAnalyzer(b,rec=>{const r=applyRetry('p5',rec);fin(r.before,r.after)});
  else if(id==='p6'){
    const idx=S.mcq.map((q,i)=>q.credit<4*DEF-1e-6?i:-1).filter(i=>i>=0);
    b.innerHTML=`<div class="card"><div id="mcqB"></div><div class="btnrow"><button class="btn green" id="reFin" disabled>✔ 보충 완료</button></div></div>`;
    const upd=()=>{$('#reFin',b).disabled=!idx.every(i=>$$('.qcard',b)[idx.indexOf(i)].classList.contains('done'))};
    renderMCQ($('#mcqB',b),idx,'retry',upd);
    $('#reFin',b).onclick=()=>fin(before,partScore('p6'));
  }else if(id==='p7'){
    const idx=S.wr.map((w,i)=>(w.score||0)<10*DEF-1e-6?i:-1).filter(i=>i>=0);
    b.innerHTML=`<div class="card"><div id="wrB"></div><div class="btnrow"><button class="btn green" id="reFin" disabled>✔ 보충 완료</button></div></div>`;
    const upd=()=>{$('#reFin',b).disabled=!idx.every(i=>S.wr[i].retry>0)};
    renderWritten($('#wrB',b),idx,'retry',upd);
    $('#reFin',b).onclick=()=>fin(before,partScore('p7'));
  }
}

/* =====================================================================
   초기화
===================================================================== */
const MOUNT={
  s1(){const b=shell('s1','Stage 1','안전한 실험실 준수 (안전 요원 미션)');
    gameDress(b,rec=>{applyFirst('p1',rec);gameEquip(b,()=>{S.done.s1=true;unlock('s2');stageEnd(b,'s2','✅ <span class="k-g">Stage 1 클리어!</span> 실험 도구가 활성화되었어요.','Stage 2 : 은빛 변신 ▶')})})},
  s2(){const b=shell('s2','Stage 2','페트리접시 속 은빛 변신 (구리 + 질산 은 수용액)');const rec=newRec();
    gameCuLab(b,()=>gameCuMicro(b,rec,()=>gameCuJudge(b,rec,()=>{applyFirst('p2',rec);S.done.s2=true;unlock('s3');stageEnd(b,'s3','✅ <span class="k-g">Stage 2 클리어!</span> 알코올램프와 마그네슘 리본이 활성화되었어요.','Stage 3 : 불꽃 속 전자 ▶')})))},
  s3(){const b=shell('s3','Stage 3','불꽃 속의 전자 이동 (마그네슘 연소)');const r3=newRec(),r4=newRec();
    gameMgLab(b,()=>gameMgMicro(b,r3,()=>{applyFirst('p3',r3);gameMgEq(b,r4,()=>{applyFirst('p4',r4);S.done.s3=true;unlock('s4');stageEnd(b,'s4','✅ <span class="k-g">Stage 3 클리어!</span> 최종 분석용 전자 스캐너가 활성화되었어요.','Stage 4 : 전자 분석기 ▶')})}))},
  s4(){const b=shell('s4','Stage 4 (Final)','전자 이동 분석기 (Master Stage)');
    gameAnalyzer(b,rec=>{applyFirst('p5',rec);S.done.s4=true;unlock('quiz');stageEnd(b,'quiz','🏁 <span class="k-g">Stage 4 클리어!</span> 산화와 환원은 전자의 이동에 의해 동시에 일어난다!','학습 점검으로 ▶')})},
  quiz(){mountQuiz()}
};
initState();mountIntro();renderTabs();
</script>
